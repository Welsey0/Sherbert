        #     file = "file-location-from-project-root"

        # [[content.pinned_remote]] # Keep a remote mod pinned to a specific version
        #     id = "modrinth-project-id-or-slug"
        #     version = "modrinth-version-id"
        #     allow_different_mc = true
        #     note = "Optional reason for pinning this exact version"

        # [[content.nonremote]] # Include a local file that has no remote
        #     file = "file-location-from-project-root"
        #     note = "Optional note"

    [fabric] # Only included in Fabric loader

    [neo] # Only included in Neoforge loader.

[variablevalues] # Values to find and update in certain config files during build process.
    version = [ # Replaces the text <!VERSION!> with the modpack version specified in this file
        # "file-location-from-project-root"
    ]

