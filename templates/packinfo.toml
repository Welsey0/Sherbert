name = "" # Name/ID of modpack
author = "" # Author's name
version = "" # Modpack version

[targets] # Versions that the modpack is targeting. For mod loaders, I always recommend the latest one.
mc = "" # Minecraft version
mc-acceptable-versions = "" # Allow mods supporting other Minecraft versions to be downloaded
neo = "" # Neoforge Loader version
fabric = "" # Fabric Loader version

[content] # Define what is in the pack here.
    [all] # Included in all loaders
        remotes = [ # Put Modrinth slugs (https://modrinth.com/mod/<slug>) below to include them
        ]

        # [[content.remote_exception]] # Replace a remote mod with a local copy
        #     id = "modrinth-project-id-or-slug"
