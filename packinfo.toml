        #     reason = "ModpackUtils Continued dosen't have a Modrinth page right now."
        #     file = "mods/mutilsc-1.2.0+fabric.26.2.jar"

[variablevalues]
    version = [
        "config/mutils/mutils.json5",
    ]

[forcedconfigs]
