        [[content.nonremote]]
            file = "resourcepacks/Sherbert_Colors.zip"
            note = "Provides colors and other UI stuff"

        [[content.pinned_remote]]
            id = "sodium"
            version = "bAZQdGpg"
            allow_different_mc = false
            note = "Sodium addons and Iris both expect release versions, not betas/alphas."

        # [[content.remote_exception]]
